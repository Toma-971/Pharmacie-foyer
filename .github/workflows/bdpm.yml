name: Base des médicaments

# Télécharge la Base de données publique des médicaments et met à jour data/bdpm.json
# (code CIP de la boîte -> nom du médicament et nombre d'unités).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 3 * *"   # le 3 de chaque mois
  push:
    branches: [main]
    paths:
      - tools/build_bdpm.py
      - .github/workflows/bdpm.yml

permissions:
  contents: write

concurrency:
  group: bdpm
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construire data/bdpm.json
        run: python3 tools/build_bdpm.py
      - name: Enregistrer si la base a changé
        run: |
          if git diff --quiet --exit-code -- data/bdpm.json && git ls-files --error-unmatch data/bdpm.json >/dev/null 2>&1; then
            echo "Base inchangée."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bdpm.json
          git commit -m "Mise à jour de la base des médicaments (BDPM)"
          git push
