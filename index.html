<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pharmacie du foyer</title>
<meta name="description" content="Le stock de médicaments de la maison, comparé aux ordonnances en cours.">
<meta name="theme-color" content="#0C6A56">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pharmacie">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0F1; --surface:#F8FBFB; --foil:#D9E2E6; --hole:#F4F8F8;
  --ink:#13202A; --ink2:#52626F; --line:#CFD9DE;
  --brand:#0C6A56; --on-brand:#FFFFFF; --miss:#C5301F; --warn:#8A5300; --focus:#1D5FD1;
  --font-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-head:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E161B; --surface:#152029; --foil:#1E2C36; --hole:#0E161B;
    --ink:#E6EEF2; --ink2:#9DAEBA; --line:#253540;
    --brand:#3DB897; --on-brand:#06231C; --miss:#FF7A6B; --warn:#F0B24A; --focus:#7FB2FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161B; --surface:#152029; --foil:#1E2C36; --hole:#0E161B;
  --ink:#E6EEF2; --ink2:#9DAEBA; --line:#253540;
  --brand:#3DB897; --on-brand:#06231C; --miss:#FF7A6B; --warn:#F0B24A; --focus:#7FB2FF;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:560px;margin:0 auto;padding:0 20px 120px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:18px 0 4px;color:var(--ink2);font-size:.9rem}
.top b{font-family:var(--font-head);font-weight:600;color:var(--ink);font-size:1.02rem;letter-spacing:-.01em}

.hero{padding:22px 0 10px}
.hero h1{font:700 clamp(2rem,7vw,2.6rem)/1.05 var(--font-head);letter-spacing:-.025em;margin:0 0 10px}
.sub{margin:0;color:var(--ink2);font-size:1.05rem}
.page-title{font:700 1.9rem/1.1 var(--font-head);letter-spacing:-.02em;margin:22px 0 14px}
h2{font:600 1.2rem/1.2 var(--font-head);letter-spacing:-.01em;margin:34px 0 6px}
h3{margin:0;font:600 1.12rem/1.25 var(--font-head)}
.muted{color:var(--ink2);font-size:.95rem;margin:4px 0}
.empty{color:var(--ink2);margin:28px 0}
.actions{display:flex;flex-direction:column;gap:12px;margin:26px 0 8px}
.row-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}

.btn{appearance:none;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:700 1rem/1 var(--font-body);min-height:48px;padding:0 18px;border-radius:12px;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.block{width:100%}
.btn.armed,.linkbtn.armed{border-color:var(--miss);color:var(--miss)}
.linkbtn{appearance:none;background:none;border:0;color:var(--brand);font:700 .95rem var(--font-body);padding:10px 4px;min-height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.icon{appearance:none;background:none;border:1.5px solid var(--line);color:var(--ink);width:44px;height:44px;border-radius:12px;font-size:1.4rem;line-height:1;cursor:pointer}

.need{padding:20px 0;border-bottom:1px solid var(--line)}
.need-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.who{color:var(--ink2);font-size:.95rem}
.need p{margin:4px 0}
.need .miss{color:var(--miss)}
.strip{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px;padding:10px;background:var(--foil);border-radius:12px}
.strip i{display:block;width:16px;height:16px;border-radius:50%}
.strip .on{background:var(--brand)}
.strip .off{background:var(--hole);border:2px solid var(--miss)}
.legend{font-size:.85rem;color:var(--ink2)}

.line-item{padding:14px 0;border-bottom:1px solid var(--line)}
.line-item .muted{margin:2px 0 0}
.warn{color:var(--warn)}
.bad{color:var(--miss)}

details.med{border-bottom:1px solid var(--line)}
details.med>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 0;min-height:58px;cursor:pointer}
details.med>summary::-webkit-details-marker{display:none}
details.med>summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);margin:0 4px 4px 4px;flex:none}
details.med[open]>summary::after{transform:rotate(225deg);margin-bottom:-2px}
details.med .m-name{flex:1;font:600 1.08rem/1.25 var(--font-head)}
details.med .m-qty{color:var(--ink2);white-space:nowrap;text-align:right;line-height:1.3}
.batch.expired{background:color-mix(in srgb,var(--miss) 9%,transparent);border-radius:10px;padding:10px;border-top-color:transparent;margin:4px 0}
.tag{display:inline-block;font-size:.75rem;letter-spacing:.02em;text-transform:uppercase;padding:2px 7px;border-radius:6px;margin-right:4px;vertical-align:1px}
.bad-tag{background:var(--miss);color:var(--surface)}
.warn-tag{background:var(--warn);color:var(--surface)}
.stock-alert{margin:14px 0 0;padding:12px 14px;border-radius:12px;border:1.5px solid var(--miss);color:var(--ink)}
input.check{border-color:var(--warn)!important;border-width:2px}
.exp-warn{margin:6px 0 0;font-size:.92rem}
.med-body{padding:0 0 18px}
.batch{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 0;border-top:1px dashed var(--line)}
.b-info{display:flex;flex-direction:column;flex:1 1 180px;font-size:.95rem}
.b-units{display:flex;align-items:center;gap:8px}
.b-units input{width:84px;min-height:44px}

.script{padding:20px 0;border-bottom:1px solid var(--line)}
.script.done{opacity:.72}
.s-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.s-lines{margin:10px 0 0;padding-left:20px}
.s-lines li{margin:4px 0}
.s-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}

.member{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}

.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.field>span{font-weight:700;font-size:.95rem}
input,select{font:inherit;min-height:48px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
input[type=file]{padding:10px 12px;height:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.line{display:grid;grid-template-columns:1fr 1fr auto;gap:0 10px;align-items:end;padding:6px 0 10px;border-bottom:1px solid var(--line)}
.line .wide{grid-column:1/-1;margin-bottom:0}
.line .field{margin:8px 0 0}
.line .icon{margin-bottom:0}
.msg{min-height:1.4em;color:var(--miss);font-weight:700;margin:10px 0 0}
.info{color:var(--ink2);margin:10px 0}
.scanbox{margin:12px 0}
.scanbox video{display:block;width:100%;height:300px;object-fit:cover;border-radius:12px;background:#000}
.cam-wrap{position:relative;cursor:pointer;overflow:hidden;border-radius:12px}
.cam-frame{position:absolute;left:50%;top:50%;width:52%;aspect-ratio:1;max-height:88%;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.scan-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.scan-btns .btn{padding:6px 10px;margin:0;line-height:1.15}
.photo-btn{display:flex;align-items:center;justify-content:center;margin-top:8px}
.photo-btn:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.line input.check{border-color:var(--warn);border-width:2px}
.l-raw{grid-column:1/-1;margin:4px 0 0;font-size:.85rem;color:var(--ink2);overflow-wrap:anywhere}
details.photo{margin:10px 0 0}details.photo>summary{list-style:none;display:inline-block;padding:6px 0;min-height:0}details.photo img{display:block;width:100%;border-radius:10px;margin-top:8px}
.scan-row{display:flex;gap:10px}.scan-row input{flex:1}
#s-preview{width:100%;max-height:280px;object-fit:contain;border-radius:10px;background:var(--foil);margin-top:8px}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{appearance:none;border:0;background:none;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;min-height:62px;font:700 .82rem var(--font-body);cursor:pointer}
.tabs button[aria-current="page"]{color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

dialog.sheet{border:0;padding:0;margin:auto auto 0;inset-inline:0;width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;background:var(--surface);color:var(--ink)}
dialog.sheet::backdrop{background:rgba(10,20,26,.55)}
dialog.sheet[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-in{padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.sheet-h h2{margin:0}
.sep{border:0;border-top:1px solid var(--line);margin:20px 0 6px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<body>
<div class="app">
  <header class="top"><b>Pharmacie du foyer</b><span id="today"></span></header>
  <main id="view"></main>
</div>

<nav class="tabs" id="tabs" aria-label="Sections">
  <div class="tabs-in">
    <button data-tab="need"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>À acheter</button>
    <button data-tab="stock"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Stock</button>
    <button data-tab="scripts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>Ordonnances</button>
    <button data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0112 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 015 5.5"/></svg>Foyer</button>
  </div>
</nav>

<dialog id="sheet" class="sheet" aria-label="Formulaire"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- Outils ---------- */
const KEY='pharmacie-foyer-v1';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
/* Cl\u00e9 de comparaison des noms : \u00ab Doliprane 1000mg \u00bb = \u00ab doliprane 1 000 mg \u00bb */
const nameKey=s=>norm(s).replace(/\u00b5/g,'u').replace(/[^a-z0-9]/g,'');
const pl=(n,s,p)=>n>1?p:s;
const fmt=n=>String(Math.round(n*100)/100).replace('.',',');
const fmtNum=n=>String(Math.round((Number(n)||0)*100)/100);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d);};
const fmtDate=s=>{if(!s)return '';const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});};
const daysUntil=s=>{const p=s.split('-').map(Number);const t=new Date();const a=new Date(p[0],p[1]-1,p[2]);const b=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((a-b)/86400000);};
const shiftDate=(s,n)=>{const p=s.split('-').map(Number);return ymd(new Date(p[0],p[1]-1,p[2]+n));};
const maxDate=(a,b)=>a>b?a:b, minDate=(a,b)=>a<b?a:b;
const daysBetween=(a,b)=>daysUntil(b)-daysUntil(a);

/* ---------- Données (stockées sur l'appareil) ---------- */
let memoryCopy=null;
function load(){
  try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}
  return memoryCopy;
}
function persist(){
  memoryCopy=JSON.parse(JSON.stringify(state));
  try{localStorage.setItem(KEY,JSON.stringify(state));return true;}
  catch(e){return false;}
}
function sanitize(s){
  if(!s||typeof s!=='object')s={};
  const arr=a=>Array.isArray(a)?a.filter(x=>x&&typeof x==='object'&&x.id):[];
  const meds=arr(s.meds).map(m=>({
    id:String(m.id),name:String(m.name||'Sans nom'),cip13:String(m.cip13||''),perBox:Number(m.perBox)||0,
    countedAt:/^\d{4}-\d{2}-\d{2}$/.test(m.countedAt||'')?m.countedAt:todayStr(),
    batches:arr(m.batches).map(b=>({id:String(b.id),lot:String(b.lot||''),expiry:String(b.expiry||''),units:Math.max(0,Number(b.units)||0)}))
  }));
  const scripts=arr(s.scripts).map(x=>({
    id:String(x.id),memberId:String(x.memberId||''),date:/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')?x.date:todayStr(),
    active:x.active!==false,photo:typeof x.photo==='string'&&x.photo.indexOf('data:image/')===0?x.photo:'',
    lines:(Array.isArray(x.lines)?x.lines:[]).filter(l=>l&&typeof l==='object').map(l=>({medId:String(l.medId),perDay:Number(l.perDay)||0,days:Number(l.days)||0}))
  }));
  return {members:arr(s.members).map(m=>({id:String(m.id),name:String(m.name||'')})),meds:meds,scripts:scripts};
}
let state=sanitize(load());
let tab='need';
const openMeds=new Set();
let warnedFull=false;
function commit(){
  if(!persist()&&!warnedFull){warnedFull=true;setTimeout(()=>toast('Le stockage du navigateur est plein ou bloqué : téléchargez une sauvegarde (onglet Foyer).'),50);}
  render();
}

/* ---------- Calculs ---------- */
/* Un traitement commence à la date de l'ordonnance (jour 1) et dure l.days jours.
   Les prises des jours écoulés (aujourd'hui exclu) sont retirées du stock ;
   les prises restantes (aujourd'hui inclus) forment le besoin. */
const lineEnd=(s,l)=>shiftDate(s.date,Number(l.days)||0);
const scriptEnd=s=>s.lines.reduce((e,l)=>maxDate(e,lineEnd(s,l)),s.date);
const running=s=>s.active&&scriptEnd(s)>todayStr();
const remainingNeed=(s,l)=>s.active?(Number(l.perDay)||0)*Math.max(0,daysBetween(maxDate(s.date,todayStr()),lineEnd(s,l))):0;
const isExpired=b=>!!b.expiry&&daysUntil(b.expiry)<0;

function consumedSince(med,from){
  const today=todayStr();let n=0;
  for(const s of state.scripts){
    if(!s.active)continue;
    for(const l of s.lines){
      if(l.medId!==med.id)continue;
      const d=daysBetween(maxDate(s.date,from),minDate(lineEnd(s,l),today));
      if(d>0)n+=(Number(l.perDay)||0)*d;
    }
  }
  return n;
}
/* Unités estimées par lot : on retire les prises depuis le dernier comptage,
   en commençant par le lot qui périme le plus tôt. */
function estimate(med){
  let left=consumedSince(med,med.countedAt||todayStr());
  const est=new Map();
  const order=med.batches.filter(b=>!isExpired(b)).sort((a,b)=>(a.expiry||'9999').localeCompare(b.expiry||'9999'));
  for(const b of med.batches)est.set(b.id,Number(b.units)||0);
  for(const b of order){
    if(left<=0)break;
    const u=est.get(b.id),take=Math.min(u,left);
    est.set(b.id,Math.round((u-take)*100)/100);left-=take;
  }
  return est;
}
const usable=m=>{const e=estimate(m);return m.batches.filter(b=>!isExpired(b)).reduce((a,b)=>a+e.get(b.id),0);};
/* Fige l'estimation dans les lots avant toute modification. */
function settle(){
  const t=todayStr();
  for(const m of state.meds){
    if(m.countedAt&&m.countedAt>=t)continue;
    const e=estimate(m);
    for(const b of m.batches)b.units=e.get(b.id);
    m.countedAt=t;
  }
}

function analyse(){
  const map=new Map();
  for(const s of state.scripts){
    if(!running(s))continue;
    const who=state.members.find(m=>m.id===s.memberId);
    for(const l of s.lines){
      const n=remainingNeed(s,l);
      if(!n)continue;
      const e=map.get(l.medId)||{need:0,who:new Set(),until:''};
      e.need+=n;e.until=maxDate(e.until,shiftDate(lineEnd(s,l),-1));
      if(who)e.who.add(who.name);
      map.set(l.medId,e);
    }
  }
  const short=[],covered=[];
  map.forEach((e,id)=>{
    const med=state.meds.find(m=>m.id===id);
    if(!med)return;
    const have=usable(med);
    const item={med:med,need:e.need,have:have,who:Array.from(e.who),until:e.until};
    (have<e.need?short:covered).push(item);
  });
  const by=(a,b)=>a.med.name.localeCompare(b.med.name,'fr');
  short.sort(by);covered.sort(by);
  return {short:short,covered:covered};
}

function expiryAlerts(){
  const expired=[],soon=[];
  for(const m of state.meds){
    const est=estimate(m);
    for(const b of m.batches){
      const u=est.get(b.id);
      if(!b.expiry||!(u>0))continue;
      const d=daysUntil(b.expiry);
      if(d<0)expired.push({m:m,b:b,d:d,u:u});
      else if(d<=60)soon.push({m:m,b:b,d:d,u:u});
    }
  }
  expired.sort((a,b)=>a.d-b.d);soon.sort((a,b)=>a.d-b.d);
  return {expired:expired,soon:soon};
}

function findMed(name,cip){
  if(cip){const m=state.meds.find(x=>x.cip13===cip);if(m)return m;}
  const k=nameKey(name);
  return k?state.meds.find(x=>nameKey(x.name)===k):undefined;
}

/* ---------- Vues ---------- */
function strip(need,have){
  const MAX=40;
  const scale=Math.max(1,Math.ceil(need/MAX));
  const total=Math.max(1,Math.ceil(need/scale));
  const filled=Math.min(total,Math.floor(have/scale));
  let dots='';
  for(let i=0;i<total;i++)dots+='<i class="'+(i<filled?'on':'off')+'"></i>';
  const label=fmt(Math.min(have,need))+' unités disponibles sur '+fmt(need)+' nécessaires';
  return '<div class="strip" role="img" aria-label="'+esc(label)+'">'+dots+'</div>'+
    (scale>1?'<p class="legend">Un rond représente '+scale+' unités.</p>':'');
}

function viewNeed(){
  const empty=!state.meds.length&&!state.scripts.length;
  if(empty){
    return '<section class="hero"><h1>Le stock du foyer, en un coup d\u2019œil</h1>'+
      '<p class="sub">Ajoutez les ordonnances et les boîtes de médicaments : l\u2019application indique ce qu\u2019il faut racheter.</p></section>'+
      '<div class="actions">'+
      '<button class="btn primary block" data-act="open-script">Ajouter une ordonnance</button>'+
      '<button class="btn block" data-act="open-box">Ajouter une boîte</button>'+
      '<button class="linkbtn" data-act="demo">Voir avec un exemple</button></div>';
  }
  const a=analyse();
  const nScripts=state.scripts.filter(running).length;
  let h='<section class="hero">';
  if(!nScripts){
    h+='<h1>Aucune ordonnance en cours</h1><p class="sub">Ajoutez une ordonnance pour savoir ce qui manque.</p>';
  }else if(!a.short.length){
    h+='<h1>Rien à racheter</h1><p class="sub">Le stock couvre '+nScripts+' '+pl(nScripts,'ordonnance en cours','ordonnances en cours')+'.</p>';
  }else{
    const n=a.short.length;
    h+='<h1>Il manque '+n+' '+pl(n,'médicament','médicaments')+'</h1><p class="sub">pour couvrir '+nScripts+' '+pl(nScripts,'ordonnance en cours','ordonnances en cours')+'.</p>';
  }
  h+='</section>';

  if(a.short.length){
    h+='<div>';
    for(const it of a.short){
      const miss=it.need-it.have;
      const boxes=it.med.perBox>0?Math.ceil(miss/it.med.perBox):0;
      const boxText=it.med.perBox>0
        ?', soit '+boxes+' '+pl(boxes,'boîte','boîtes')+' de '+fmt(it.med.perBox)
        :' (indiquez la taille d\u2019une boîte dans le stock pour obtenir un nombre de boîtes)';
      h+='<article class="need"><div class="need-head"><h3>'+esc(it.med.name)+'</h3>'+
        (it.who.length?'<span class="who">pour '+esc(it.who.join(', '))+'</span>':'')+'</div>'+
        strip(it.need,it.have)+
        '<p class="miss"><strong>Manque '+fmt(miss)+' '+pl(miss,'unité','unités')+'</strong>'+boxText+'.</p>'+
        '<p class="muted">Il en faut encore '+fmt(it.need)+' jusqu\u2019au '+fmtDate(it.until)+', il en reste '+fmt(it.have)+'.</p></article>';
    }
    h+='</div>';
  }

  if(a.covered.length){
    h+='<h2>Déjà couverts</h2>';
    for(const it of a.covered){
      h+='<div class="line-item"><strong>'+esc(it.med.name)+'</strong>'+
        (it.who.length?' <span class="who">pour '+esc(it.who.join(', '))+'</span>':'')+
        '<p class="muted">Il en faut encore '+fmt(it.need)+' jusqu\u2019au '+fmtDate(it.until)+', le stock en compte '+fmt(it.have)+'.</p></div>';
    }
  }

  const ex=expiryAlerts();
  if(ex.expired.length){
    h+='<h2>À rapporter en pharmacie</h2>';
    for(const e of ex.expired){
      h+='<div class="line-item"><strong>'+esc(e.m.name)+'</strong>'+
        '<p class="muted bad">'+fmt(e.u)+' '+pl(e.u,'unité périmée','unités périmées')+' depuis le '+fmtDate(e.b.expiry)+'. Ces unités ne sont pas comptées dans le stock.</p></div>';
    }
  }
  if(ex.soon.length){
    h+='<h2>Bientôt périmés</h2>';
    for(const e of ex.soon){
      const when=e.d===0?'aujourd\u2019hui':'dans '+e.d+' '+pl(e.d,'jour','jours');
      h+='<div class="line-item"><strong>'+esc(e.m.name)+'</strong>'+
        '<p class="muted warn">'+fmt(e.u)+' '+pl(e.u,'unité','unités')+', périme le '+fmtDate(e.b.expiry)+' ('+when+').</p></div>';
    }
  }

  h+='<div class="actions"><button class="btn primary block" data-act="open-script">Ajouter une ordonnance</button>'+
     '<button class="btn block" data-act="open-box">Ajouter une boîte</button></div>';
  return h;
}

function batchHtml(m,b,u){
  let txt,cls='';
  if(!b.expiry){txt='Pas de date de péremption';}
  else{
    const d=daysUntil(b.expiry);
    if(d<0){txt='Périmé depuis le '+fmtDate(b.expiry)+' : à rapporter en pharmacie, non compté dans le stock';cls='bad';}
    else if(d<=60){txt='Périme le '+fmtDate(b.expiry)+' (dans '+d+' '+pl(d,'jour','jours')+')';cls='warn';}
    else txt='Périme le '+fmtDate(b.expiry);
  }
  const exp=cls==='bad';
  return '<div class="batch'+(exp?' expired':'')+'"><div class="b-info"><span>'+(exp?'<b class="tag bad-tag">Périmé</b> ':cls==='warn'?'<b class="tag warn-tag">Bientôt</b> ':'')+(b.lot?'Lot '+esc(b.lot):'Sans numéro de lot')+'</span><span class="'+cls+'">'+esc(txt)+'</span></div>'+
    '<label class="b-units"><span class="sr">Unités restantes dans ce lot</span>'+
    '<input type="number" min="0" step="any" inputmode="decimal" value="'+esc(fmtNum(u))+'" data-batch="'+b.id+'" data-med="'+m.id+'"><span class="muted">unités</span></label>'+
    '<button class="linkbtn" data-act="del-batch" data-med="'+m.id+'" data-batch="'+b.id+'" data-confirm="Confirmer le retrait">Retirer</button></div>';

function scriptHtml(s){
  const who=state.members.find(m=>m.id===s.memberId);
  const lines=s.lines.map(l=>{
    const m=state.meds.find(x=>x.id===l.medId);
    if(!m)return '';
    const tot=l.perDay*l.days;
    const left=running(s)?remainingNeed(s,l):0;
    const rest=left>0&&left<tot?' (reste '+fmt(left)+')':'';
    return '<li><strong>'+esc(m.name)+'</strong> : '+fmt(l.perDay)+' par jour pendant '+fmt(l.days)+' '+pl(l.days,'jour','jours')+', soit '+fmt(tot)+' '+pl(tot,'unité','unités')+rest+'</li>';
  }).join('');
  const run=running(s);
  const end=shiftDate(scriptEnd(s),-1);
  const when=s.date>todayStr()?'Commence le '+fmtDate(s.date)
    :run?'Depuis le '+fmtDate(s.date)+', jusqu\u2019au '+fmtDate(end)
    :s.active?'Terminée le '+fmtDate(end):'Arrêtée (commencée le '+fmtDate(s.date)+')';
  return '<article class="script'+(run?'':' done')+'"><div class="s-head"><h3>'+esc(who?who.name:'Personne supprimée')+'</h3><span class="muted">'+when+'</span></div>'+
    '<ul class="s-lines">'+lines+'</ul>'+
    (s.photo?'<details class="photo"><summary class="linkbtn">Voir la photo de l\u2019ordonnance</summary><img src="'+s.photo+'" alt="Photo de l\u2019ordonnance"></details>':'')+
    '<div class="s-actions">'+
    (run?'<button class="btn" data-act="toggle-script" data-id="'+s.id+'">Arrêter le traitement</button>'
      :!s.active?'<button class="btn" data-act="toggle-script" data-id="'+s.id+'">Reprendre le traitement</button>':'')+
    '<button class="linkbtn" data-act="del-script" data-id="'+s.id+'" data-confirm="Confirmer la suppression">Supprimer</button></div></article>';
}

/* Suggestions pendant la saisie : médicaments du foyer, puis noms officiels de la BDPM. */
let bdpmNames=null;
async function suggestNames(input){
  const q=norm(input.value).split(/[^a-z0-9]+/).filter(Boolean);
  const dl=$('#medlist');if(!dl)return;
  const home=state.meds.map(m=>m.name);
  if(!q.length||q.join('').length<3){dl.innerHTML=home.map(n=>'<option value="'+esc(n)+'"></option>').join('');return;}
  if(!bdpmNames){
    const db=await loadBdpm();
    if(db&&db.n){
      const seen=new Set();bdpmNames=[];
      for(const n of db.n){const p=prettyMedName(n);if(!seen.has(p)){seen.add(p);bdpmNames.push([p,norm(p).split(/[^a-z0-9]+/).filter(Boolean)]);}}
    }else bdpmNames=[];
  }
  const hit=words=>q.every(w=>words.some(x=>x.indexOf(w)===0));
  const out=home.filter(n=>hit(norm(n).split(/[^a-z0-9]+/)));
  const more=[];
  for(const [p,w] of bdpmNames){if(more.length>=300)break;if(out.indexOf(p)<0&&hit(w))more.push(p);}
  more.sort((a,b)=>a.length-b.length||a.localeCompare(b,'fr'));
  out.push(...more.slice(0,Math.max(0,20-out.length)));
  if(input.isConnected)dl.innerHTML=out.map(n=>'<option value="'+esc(n)+'"></option>').join('');
}

/* ---------- Lecture des codes ---------- */
function parseCode(raw){
  const out={};
  let s=String(raw||'').trim();
  if(!s)return out;
  const set=(ai,v)=>{
    if(ai==='01'){
      const g=String(v).replace(/\D/g,'');
      if(g.length===14)out.cip13=g[0]==='0'?g.slice(1):g;
    }else if(ai==='17'&&/^\d{6}$/.test(v)){
      const y=2000+Number(v.slice(0,2)),m=Number(v.slice(2,4));let d=Number(v.slice(4,6));
      if(m>=1&&m<=12){
        if(!d)d=new Date(y,m,0).getDate();
        out.expiry=y+'-'+pad(m)+'-'+pad(d);
      }
    }else if(ai==='10'&&v){
      out.lot=String(v).trim();
    }
  };
  if(/^\d{13}$/.test(s)){out.cip13=s;return out;}
  if(/^0\d{13}$/.test(s)){out.cip13=s.slice(1);return out;}
  if(/\(\d{2}\)/.test(s)){
    const re=/\((\d{2})\)([^(]*)/g;let m;
    while((m=re.exec(s)))set(m[1],m[2].trim());
  }else{
    // séparateur GS (FNC1) parfois rendu autrement selon le lecteur
    s=s.replace(/^\]d2/i,'').replace(/<GS>|\u241D|\u001D/gi,'\x1d').replace(/^\x1d+/,'');
    const FIXED={'00':18,'01':14,'02':14,'11':6,'12':6,'13':6,'15':6,'16':6,'17':6,'20':2};
    let i=0;
    while(i<s.length){
      if(s[i]==='\x1d'){i++;continue;}
      const ai=s.slice(i,i+2);
      if(FIXED[ai]){set(ai,s.slice(i+2,i+2+FIXED[ai]));i+=2+FIXED[ai];continue;}
      // champs de longueur variable (lot 10, série 21, 240, 241, 710 à 715, 30…) : jusqu'au GS
      let len=0;
      if(ai==='10'||ai==='21'||ai==='22'||ai==='30'||ai==='37')len=2;
      else if(/^(24[01]|71[0-5]|25[0-4])$/.test(s.slice(i,i+3)))len=3;
      else break;
      let j=s.indexOf('\x1d',i+len);if(j<0)j=s.length;
      set(s.slice(i,i+len),s.slice(i+len,j));i=j+1;
    }
  }
  return out;
}

/* ---------- Base publique des médicaments (code CIP -> nom, unités) ---------- */
/* data/bdpm.json est reconstruit chaque mois par GitHub depuis la BDPM officielle. */
let bdpmP=null;
function loadBdpm(){
  if(!bdpmP)bdpmP=fetch('data/bdpm.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).catch(()=>{bdpmP=null;return null;});
  return bdpmP;
}
/* « AMOXICILLINE BIOGARAN 500 mg, gélule » -> « Amoxicilline Biogaran 500 mg » */
function prettyMedName(n){
  let s=String(n||'').split(/,\s/)[0].trim();
  const core=s.replace(/\d[\d.,\s]*(?:mg|g|ml|µg|ui|%)(?![a-z])/gi,'').replace(/[^A-Za-zÀ-ÿ]/g,'');
  if(core.length>2&&core===core.toUpperCase()){
    s=s.toLowerCase().replace(/(^|[\s\-\/(])([a-zà-ÿ])/g,(a,b,c)=>b+c.toUpperCase())
      .replace(/\b(Mg|Ml|G|Mcg|Ug|Microgrammes?|Milligrammes?)\b/g,x=>x.toLowerCase()).replace(/\bUi\b/g,'UI').replace(/µG\b/g,'µg');
  }
  return s;
}
async function lookupCip(cip){
  const db=await loadBdpm();
  const e=db&&db.c&&db.c[cip];
  if(!e)return null;
  return {name:prettyMedName(db.n[e[0]]),fullName:db.n[e[0]],perBox:e[1]||0,group:(db.g&&db.g[e[0]])||0};
}

async function applyCode(raw){
  const msg=$('#scanMsg');if(!msg)return;
  const r=parseCode(raw);
  if(!r.cip13&&!r.expiry){
    msg.textContent='Ce code n\u2019est pas reconnu. Cherchez le petit code carré (DataMatrix) sur la boîte, ou saisissez les informations à la main.';
    return;
  }
  sheet.dataset.cip=r.cip13||'';
  sheet.dataset.cipSrc=r.cip13?'scan':'';
  if(r.expiry)$('#f-exp').value=r.expiry;
  if(r.lot)$('#f-lot').value=r.lot;
  syncExpWarn();
  const got=[];
  if(r.expiry)got.push('la péremption');
  if(r.lot)got.push('le lot');
  const known=r.cip13?state.meds.find(m=>m.cip13===r.cip13):null;
  let info=null;
  if(!known&&r.cip13){
    msg.textContent='Code lu. Recherche du médicament\u2026';
    info=await lookupCip(r.cip13);
    if(!msg.isConnected||sheet.dataset.cip!==r.cip13)return;
  }
  const src=known||info;
  if(src){
    $('#f-name').value=src.name;
    const pb=$('#f-perbox');
    if(src.perBox){pb.value=src.perBox;pb.dataset.auto='1';}
    syncUnits();
    got.unshift('le nom');
    if(src.perBox)got.splice(1,0,'le nombre d\u2019unités');
  }
  const list=got.length>1?got.slice(0,-1).join(', ')+' et '+got[got.length-1]:got[0];
  if(src){
    msg.textContent='Boîte reconnue : '+src.name+(info?' (base publique des médicaments)':'')+'. '+
      (list?'J\u2019ai rempli '+list+'. ':'')+
      (src.perBox?'':'Indiquez le nombre d\u2019unités par boîte. ')+'Vérifiez, corrigez si besoin, puis ajoutez au stock.';
  }else{
    msg.textContent='Code lu'+(r.cip13?' (CIP '+r.cip13+')':'')+(list?' : j\u2019ai rempli '+list:'')+'. Ce médicament n\u2019est pas dans la base publique : tapez son nom ci-dessous (des suggestions s\u2019affichent) et le nombre d\u2019unités par boîte. Ils seront retenus pour les prochains scans de cette boîte.';
    const n=$('#f-name');
    if(n){n.classList.add('check');n.focus({preventScroll:true});n.scrollIntoView({block:'center',behavior:'smooth'});}
    const pb=$('#f-perbox');if(pb&&!pb.value)pb.classList.add('check');
  }
}
function syncExpWarn(){
  const e=$('#f-exp'),w=$('#expWarn');if(!e||!w)return;
  const v=e.value;
  if(v&&daysUntil(v)<0){w.textContent='Boîte périmée depuis le '+fmtDate(v)+'. Elle sera enregistrée comme périmée et ne comptera pas dans le stock disponible.';w.hidden=false;}
  else w.hidden=true;
}
/* Unités ajoutées au stock = unités par boîte × boîtes, sauf si on l'a changé à la main (boîte entamée). */
function syncUnits(){
  const u=$('#f-units');if(!u||u.dataset.manual==='1')return;
  const n=(Number($('#f-perbox').value)||0)*(Number($('#f-boxes').value)||0);
  u.value=n>0?n:'';
}

/* Décodage : le lecteur intégré au navigateur s'il sait lire le DataMatrix,
   sinon zxing-wasm (hébergé avec l'appli, marche sur tous les téléphones). */
let nativeDet=null,zxingReady=null;
async function getDecoders(){
  if(nativeDet===null){
    nativeDet=false;
    try{
      if('BarcodeDetector' in window){
        const sup=await window.BarcodeDetector.getSupportedFormats();
        if(sup.indexOf('data_matrix')>=0)nativeDet=new window.BarcodeDetector({formats:['data_matrix','qr_code','ean_13','code_128'].filter(f=>sup.indexOf(f)>=0)});
      }
    }catch(e){nativeDet=false;}
  }
  if(!zxingReady){
    zxingReady=loadScript('vendor/zxing/zxing-reader.js').then(()=>{
      const wasm=new URL('vendor/zxing/zxing_reader.wasm',location.href).href;
      window.ZXingWASM.prepareZXingModule({overrides:{locateFile:(path,prefix)=>path.endsWith('.wasm')?wasm:prefix+path},fireImmediately:true});
      return window.ZXingWASM;
    }).catch(e=>{zxingReady=null;throw e;});
  }
}
async function decodeCanvas(c){
  if(nativeDet){
    try{const r=await nativeDet.detect(c);if(r.length&&r[0].rawValue)return r[0].rawValue;}catch(e){}
  }
  try{
    const Z=await zxingReady;
    const d=c.getContext('2d').getImageData(0,0,c.width,c.height);
    const r=await Z.readBarcodes(d,{formats:['DataMatrix','QRCode','EAN-13','Code128'],tryHarder:true,tryRotate:true,tryInvert:false,maxNumberOfSymbols:1});
    if(r.length&&r[0].text)return r[0].text;
  }catch(e){}
  return '';
}
/* Copie une zone (carré central ou image entière) dans un canevas de taille utile. */
function cropTo(src,sw,sh,frac,target){
  const side=Math.min(sw,sh)*frac;
  const w=frac>=1?sw:side,h=frac>=1?sh:side;
  const k=Math.min(1,target/Math.max(w,h))||1;
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
  c.getContext('2d',{willReadFrequently:true}).drawImage(src,(sw-w)/2,(sh-h)/2,w,h,0,0,c.width,c.height);
  return c;
}
function codeFound(raw){
  stopScan();
  const inp=$('#f-code');if(inp)inp.value=raw;
  try{if(navigator.vibrate)navigator.vibrate(80);}catch(e){}
  applyCode(raw);
}

let stream=null,scanTimer=null,scanTrack=null,torchOn=false;
async function startScan(){
  const msg=$('#scanMsg');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    msg.textContent='La caméra n’est pas disponible ici. Utilisez « Photographier le code » ou tapez le code.';return;
  }
  stopScan();
  msg.textContent='Ouverture de la caméra…';
  try{await getDecoders();}catch(e){}
  try{
    // haute résolution : le petit carré a besoin de pixels
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},advanced:[{focusMode:'continuous'}]}});
  }catch(e){
    try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});}
    catch(e2){msg.textContent='La caméra n’est pas accessible (autorisation refusée ou bloquée ici). Utilisez « Photographier le code » ou tapez le code.';return;}
  }
  const v=$('#cam');
  if(!v){stopScan();return;}
  scanTrack=stream.getVideoTracks()[0]||null;
  await tuneCamera();
  v.srcObject=stream;
  try{await v.play();}catch(e){}
  $('.scanbox').hidden=false;
  msg.textContent='Placez le petit carré dans le cadre, à 10 ou 15 cm. Si l’image reste floue, reculez un peu et zoomez.';
  let busy=false,n=0;
  scanTimer=setInterval(async()=>{
    if(busy||!v.videoWidth)return;
    busy=true;
    try{
      // alterne : carré central agrandi (petits codes) puis image entière
      const frac=[0.5,0.75,1][n++%3];
      const raw=await decodeCanvas(cropTo(v,v.videoWidth,v.videoHeight,frac,frac<1?900:1280));
      if(raw&&stream)codeFound(raw);
    }catch(e){}
    busy=false;
  },180);
}
/* Mise au point continue, zoom et lampe quand le téléphone les propose. */
async function tuneCamera(){
  const zoomWrap=$('#zoomWrap'),torchBtn=$('#torchBtn');
  if(zoomWrap)zoomWrap.hidden=true;
  if(torchBtn)torchBtn.hidden=true;
  if(!scanTrack||!scanTrack.getCapabilities)return;
  let caps={};try{caps=scanTrack.getCapabilities()||{};}catch(e){}
  const adv={};
  if(Array.isArray(caps.focusMode)&&caps.focusMode.indexOf('continuous')>=0)adv.focusMode='continuous';
  if(caps.zoom&&caps.zoom.max>1){
    // un léger zoom permet de tenir le téléphone plus loin, là où il fait la mise au point
    adv.zoom=Math.min(caps.zoom.max,Math.max(caps.zoom.min||1,2));
    const z=$('#zoom');
    if(z&&zoomWrap){z.min=caps.zoom.min||1;z.max=caps.zoom.max;z.step=caps.zoom.step||0.1;z.value=adv.zoom;zoomWrap.hidden=false;}
  }
  if(caps.torch&&torchBtn){torchBtn.hidden=false;torchOn=false;torchBtn.textContent='Allumer la lampe';}
  if(Object.keys(adv).length){try{await scanTrack.applyConstraints({advanced:[adv]});}catch(e){}}
}
/* Toucher l'image relance la mise au point. */
async function refocus(){
  if(!scanTrack||!scanTrack.getCapabilities)return;
  let caps={};try{caps=scanTrack.getCapabilities()||{};}catch(e){}
  const modes=Array.isArray(caps.focusMode)?caps.focusMode:[];
  try{
    if(modes.indexOf('single-shot')>=0){
      await scanTrack.applyConstraints({advanced:[{focusMode:'single-shot',pointsOfInterest:[{x:0.5,y:0.5}]}]});
      if(modes.indexOf('continuous')>=0)setTimeout(()=>{if(scanTrack)scanTrack.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});},1200);
    }else if(modes.indexOf('continuous')>=0){
      await scanTrack.applyConstraints({advanced:[{focusMode:'manual'}]}).catch(()=>{});
      await scanTrack.applyConstraints({advanced:[{focusMode:'continuous'}]});
    }
  }catch(e){}
}
async function toggleTorch(){
  if(!scanTrack)return;
  torchOn=!torchOn;
  try{await scanTrack.applyConstraints({advanced:[{torch:torchOn}]});}catch(e){torchOn=false;}
  const b=$('#torchBtn');if(b)b.textContent=torchOn?'Éteindre la lampe':'Allumer la lampe';
}
function stopScan(){
  if(scanTimer){clearInterval(scanTimer);scanTimer=null;}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  scanTrack=null;torchOn=false;
  const b=$('.scanbox');if(b)b.hidden=true;
}
/* Photo prise avec l'appareil photo du téléphone (meilleure mise au point que la vidéo). */
async function decodePhoto(file){
  const msg=$('#scanMsg');if(!msg)return;
  stopScan();
  msg.textContent='Recherche du code sur la photo…';
  try{await getDecoders();}catch(e){}
  let bmp;
  try{bmp=await loadImage(file);}catch(e){msg.textContent='Cette image n’a pas pu être lue.';return;}
  const W=bmp.naturalWidth||bmp.width,H=bmp.naturalHeight||bmp.height;
  for(const [frac,target] of [[1,2000],[0.6,1400],[0.35,1000],[1,3000],[0.2,800]]){
    const raw=await decodeCanvas(cropTo(bmp,W,H,frac,target));
    if(raw){if(msg.isConnected)codeFound(raw);return;}
  }
  if(msg.isConnected)msg.textContent='Code non trouvé sur la photo. Reprenez-la plus près, le petit carré bien net et au centre, ou tapez le code écrit à côté.';
}
function loadImage(file){
  return new Promise((ok,ko)=>{
    const url=URL.createObjectURL(file);const im=new Image();
    im.onload=()=>{ok(im);setTimeout(()=>URL.revokeObjectURL(url),1000);};
    im.onerror=()=>{URL.revokeObjectURL(url);ko(new Error('image'));};
    im.src=url;
  });
}

/* ---------- Lecture du texte d'une ordonnance ---------- */
/* Transforme le texte reconnu (OCR) en lignes { name, perDay, days }.
   Règles simples, pensées pour les ordonnances françaises imprimées. */
const RX_STRIP=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const NUMW={un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10,douze:12,quinze:15,vingt:20,trente:30,demi:0.5};
const NUM='(\\d+(?:[.,]\\d+)?|1/2|½|1/4|¼|un|une|deux|trois|quatre|cinq|six|sept|huit|neuf|dix|douze|quinze|vingt|trente|demi)';
const UNIT='(?:mg|g|µg|ug|mcg|ml|ui|u\\.?i\\.?|%|mg/ml|mg/g|microgrammes?|milligrammes?|grammes?)';
const FORM='(?:cp|cps|comprimes?|cpr|gel|gelules?|caps(?:ules?)?|sachets?|ampoules?|amp|doses?|bouffees?|inhalations?|pulverisations?|gouttes?|gttes?|cuillere?s?(?:\\s+a\\s+(?:soupe|cafe))?|cac|cas|suppositoires?|suppo|applications?|patchs?|unites?|injections?|mesures?|pipettes?|ovules?|pastilles?)';
function num(s){
  s=RX_STRIP(s).trim();
  if(s==='1/2'||s==='½')return 0.5;
  if(s==='1/4'||s==='¼')return 0.25;
  if(s in NUMW)return NUMW[s];
  const n=Number(s.replace(',','.'));
  return isFinite(n)?n:NaN;
}
const NOISE=/\b(docteur|dr\.?|medecin|rpps|adeli|finess|tel|telephone|fax|e-?mail|courriel|ne\(e\)|nee? le|patient|patiente|madame|monsieur|mme|mr|m\.|adresse|cabinet|signature|ordonnance|bizone|ald|affection|securite sociale|cpam|rue|avenue|bd|boulevard|cedex|age|poids|kg|taille|renouvel|qsp total|medecine generale|specialiste|conventionne|secteur|consultation|sur rendez|rdv|www\.|@)\b/;

function isDrugLine(raw,known){
  const t=RX_STRIP(raw);
  if(t.replace(/[^a-z]/g,'').length<3)return false;
  const key=t.replace(/[^a-z0-9]/g,'');
  for(const k of known)if(k.length>=5&&key.indexOf(k)===0)return true;
  if(NOISE.test(t))return false;
  // un dosage (500 mg, 1 g, 100 000 UI, 2,5 %) précédé d'un mot d'au moins 3 lettres
  if(new RegExp('[a-z]{3,}[^\\n]*?\\d+(?:[ .,]\\d+)*\\s?'+UNIT+'(?![a-z])').test(t))return true;
  // ligne à puce ou numérotée qui commence par un nom (« - Rhinofluimucil … »)
  if(/^\s*(?:[-–•*·]|\d{1,2}\s*[).])\s*[A-Za-zÀ-ÿ]{4,}/.test(raw)&&!/^\s*(?:[-–•*·]|\d{1,2}\s*[).])\s*(prendre|faire|appliquer|mettre|si|en|a|le|la|les|pendant|puis|matin|midi|soir)\b/.test(t))return true;
  // NOM EN MAJUSCULES suivi d'une forme (DOLIPRANE comprimé)
  if(/^[\s\-•*\d.)]*[A-ZÉÈÀÇ][A-ZÉÈÀÇ0-9\- ]{3,}/.test(raw.trim())&&new RegExp('\\b'+FORM+'\\b').test(t)&&!/\b(fois|par jour|matin|soir|pendant)\b/.test(t))return true;
  return false;
}
function cleanName(raw){
  let s=raw.replace(/^[\s\-–•*·>]*(?:\d{1,2}\s*[).\-]\s+)?/,'').trim();
  // garder jusqu'au dosage inclus (et sa forme : « 500 mg gélule »)
  const t=RX_STRIP(s);
  const m=new RegExp('^(.*?\\d+(?:[ .,]\\d+)*\\s?'+UNIT+'(?:\\s*/\\s*\\d*(?:[.,]\\d+)?\\s?'+UNIT+')?)(?![a-z])').exec(t);
  if(m)s=s.slice(0,m[1].length);
  else{
    const f=new RegExp('\\s(?:'+FORM+'|:|,|-)\\b').exec(t);
    if(f&&f.index>2)s=s.slice(0,f.index);
  }
  s=s.replace(/[\s:;,\-–]+$/,'').replace(/\s+/g,' ');
  // MAJUSCULES -> Majuscule initiale, en gardant les unités en minuscules
  const letters=s.replace(/\d.*$/,'');
  if(letters.length>2&&letters===letters.toUpperCase())s=s.toLowerCase().replace(/(^|\s|-)([a-zà-ÿ])/g,(a,b,c)=>b+c.toUpperCase()).replace(/\b(Mg|Ml|Ug|Mcg|G)\b/g,x=>x.toLowerCase()).replace(/\bUi\b/g,'UI');
  return s;
}
function readPerDay(t){
  // 1-0-1 / 1-1-1-1
  let m=/(?:^|\s)((?:\d(?:[.,]5)?|1\/2)\s*-\s*(?:\d(?:[.,]5)?|1\/2)\s*-\s*(?:\d(?:[.,]5)?|1\/2)(?:\s*-\s*(?:\d(?:[.,]5)?|1\/2))?)(?=\s|$)/.exec(t);
  if(m){const v=m[1].split('-').map(num).reduce((a,b)=>a+b,0);if(v>0)return v;}
  const qtyRe=new RegExp(NUM+'\\s*'+FORM+'?');
  const leadQty=()=>{
    const q=new RegExp(NUM+'\\s*'+FORM).exec(t)||new RegExp('(?:^|\\s)'+NUM+'(?=\\s+(?:le|au|a|matin|midi|soir|par|x|fois))').exec(t);
    const v=q?num(q[1]):1;return v>0&&v<20?v:1;
  };
  // toutes les N heures
  m=/toutes? les\s+(\d+)\s*(?:h|heures?)\b/.exec(t);
  if(m&&+m[1]>0)return leadQty()*Math.round(24/+m[1]);
  // N fois par jour / N x/j / Nx par jour
  m=new RegExp(NUM+'\\s*(?:fois|x)\\s*(?:/|par|le|au)?\\s*(?:jour|j)\\b').exec(t)||new RegExp('(?:x|fois)\\s*'+NUM+'\\s*(?:/|par)\\s*(?:jour|j)\\b').exec(t);
  if(m){const f=num(m[1]);if(f>0)return leadQty()*f;}
  // matin / midi / soir / coucher
  const moments=['matin','midi','gouter','soir','coucher','nuit'].filter(w=>new RegExp('\\b'+w+'s?\\b').test(t));
  if(moments.length){
    // « 2 le matin et 1 le soir »
    const parts=[...t.matchAll(new RegExp(NUM+'\\s*'+FORM+'?\\s*(?:le|au|a|au moment du|du)?\\s*(matin|midi|gouter|soir|coucher|nuit)','g'))];
    if(parts.length>=2)return parts.reduce((a,p)=>a+(num(p[1])||1),0);
    let n=moments.length;
    if(moments.indexOf('soir')>=0&&moments.indexOf('coucher')>=0)n--;
    return leadQty()*n;
  }
  // N par jour / N cp/j / N comprimés par jour
  m=new RegExp(NUM+'\\s*'+FORM+'?\\s*(?:/|par)\\s*(?:jour|j|24\\s*h)\\b').exec(t);
  if(m){const v=num(m[1]);if(v>0)return v;}
  // une fois / N comprimé(s) sans fréquence : 1 par jour par défaut s'il y a « par jour » ailleurs
  if(/\b(par jour|\/j|quotidien|chaque jour|tous les jours)\b/.test(t))return leadQty();
  return 0;
}
function readDays(t){
  let m=new RegExp('(?:pendant|durant|pour|sur|qsp|q\\.s\\.p\\.?|x|duree\\s*:?)\\s*'+NUM+'\\s*(jours?|j|semaines?|sem|mois|m)\\b').exec(t)
     ||new RegExp('(?:^|\\s)'+NUM+'\\s*(jours?|semaines?|mois)\\b').exec(t)
     ||/(?:^|[\s,;])(\d+)\s*(j)\b(?!\s*\/)/.exec(t);
  if(!m)return 0;
  const n=num(m[1]);if(!(n>0))return 0;
  const u=m[2];
  return Math.round(u[0]==='s'?n*7:u[0]==='m'?n*30:n);
}
const MONTHS={janvier:1,fevrier:2,mars:3,avril:4,mai:5,juin:6,juillet:7,aout:8,septembre:9,octobre:10,novembre:11,decembre:12};
function readDate(text){
  const t=RX_STRIP(text);
  let m=/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](20\d{2}|\d{2})\b/.exec(t);
  let d,mo,y;
  if(m){d=+m[1];mo=+m[2];y=+m[3];}
  else{
    m=/\b(\d{1,2}|1er)\s+(janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre)\s+(20\d{2})\b/.exec(t);
    if(m){d=m[1]==='1er'?1:+m[1];mo=MONTHS[m[2]];y=+m[3];}
  }
  if(!m)return '';
  if(y<100)y+=2000;
  if(mo<1||mo>12||d<1||d>31)return '';
  const now=new Date();
  const dt=new Date(y,mo-1,d);
  // une date de naissance ou très ancienne n'est pas la date de l'ordonnance
  if(dt>new Date(now.getFullYear(),now.getMonth(),now.getDate()+1)||(now-dt)>400*86400000)return '';
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function parseOrdonnance(text,knownNames){
  const known=(knownNames||[]).map(n=>RX_STRIP(n).replace(/[^a-z0-9]/g,'')).filter(Boolean);
  const rows=String(text||'').split(/\r?\n/).map(s=>s.replace(/[|_~]+/g,' ').replace(/(\d)\s?(?:jig|jg|pg|ug|yg|μg|mcg)\b/gi,'$1 µg').replace(/\s+/g,' ').trim()).filter(Boolean);
  const out=[];let cur=null;
  // durée valable pour toute l'ordonnance (« Traitement pour 1 mois », « QSP 3 mois »)
  let globalDays=0;
  for(const r of rows){
    const t=RX_STRIP(r);
    if(/\b(qsp|traitement|renouveler|renouvelable)\b/.test(t)&&!isDrugLine(r,known)){const d=readDays(t);if(d)globalDays=d;}
  }
  for(const r of rows){
    if(isDrugLine(r,known)){
      cur={name:cleanName(r),text:RX_STRIP(r),raw:[r]};out.push(cur);
    }else if(cur&&cur.raw.length<4&&!NOISE.test(RX_STRIP(r))){
      cur.text+=' '+RX_STRIP(r);cur.raw.push(r);
    }else if(cur&&cur.raw.length>=4)cur=null;
  }
  return {
    date:readDate(text),
    lines:out.filter(l=>l.name.length>=3).map(l=>({
      name:l.name,
      perDay:readPerDay(l.text),
      days:readDays(l.text)||globalDays,
      raw:l.raw.join(' / ')
    }))
  };
}

/* ---------- Lecture de la photo sur le téléphone (tesseract.js) ---------- */
let ocrWorker=null,ocrProgress=null,ocrRun=0;
function loadScript(src){
  return new Promise((ok,ko)=>{const el=document.createElement('script');el.src=src;el.onload=ok;el.onerror=ko;document.head.appendChild(el);});
}
async function getOcr(){
  if(!window.Tesseract)await loadScript('vendor/tesseract/tesseract.min.js');
  if(!ocrWorker){
    const base=new URL('vendor/tesseract/',location.href).href;
    ocrWorker=await window.Tesseract.createWorker('fra',1,{
      workerPath:base+'worker.min.js',corePath:base+'core/',langPath:base+'lang',
      gzip:true,workerBlobURL:false,
      logger:m=>{if(ocrProgress)ocrProgress(m);}
    });
  }
  return ocrWorker;
}
/* Prépare l'image : taille raisonnable, niveaux de gris, contraste étiré. */
function prepForOcr(file){
  return new Promise((ok,ko)=>{
    const url=URL.createObjectURL(file);
    const im=new Image();
    im.onload=()=>{
      const k=Math.min(1,2400/Math.max(im.naturalWidth,im.naturalHeight));
      const c=document.createElement('canvas');
      c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
      const g=c.getContext('2d');g.drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      try{
        const d=g.getImageData(0,0,c.width,c.height),p=d.data;
        let lo=255,hi=0;const lum=new Uint8ClampedArray(p.length/4);
        for(let i=0,j=0;i<p.length;i+=4,j++){const v=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000;lum[j]=v;if(v<lo)lo=v;if(v>hi)hi=v;}
        const span=Math.max(40,hi-lo);
        for(let i=0,j=0;i<p.length;i+=4,j++){const v=(lum[j]-lo)*255/span;p[i]=p[i+1]=p[i+2]=v;}
        g.putImageData(d,0,0);
      }catch(e){}
      ok(c);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);ko(new Error('image'));};
    im.src=url;
  });
}
/* Rapproche un nom lu d'un médicament déjà connu du foyer. */
function matchKnown(name){
  const k=nameKey(name);if(k.length<4)return name;
  const hit=state.meds.find(m=>{const mk=nameKey(m.name);return mk&&(mk===k||(mk.length>=5&&k.indexOf(mk)===0)||(k.length>=5&&mk.indexOf(k)===0));});
  return hit?hit.name:name;
}
async function readPrescription(file){
  const msg=$('#ocrMsg');if(!msg)return;
  const run=++ocrRun;
  const say=t=>{if(run===ocrRun&&msg.isConnected)msg.textContent=t;};
  say('Préparation de la lecture\u2026');
  ocrProgress=m=>{
    if(m.status==='recognizing text')say('Lecture de l\u2019ordonnance\u2026 '+Math.round((m.progress||0)*100)+' %');
    else if(/load|initializ/i.test(m.status||''))say('Préparation de la lecture\u2026 (la première fois, l\u2019appli télécharge environ 5 Mo)');
  };
  let text='';
  try{
    const [w,canvas]=await Promise.all([getOcr(),prepForOcr(file)]);
    const res=await w.recognize(canvas);
    text=res&&res.data?res.data.text:'';
  }catch(e){
    say('La lecture n\u2019a pas fonctionné sur ce téléphone. Saisissez les lignes à la main.');
    return;
  }
  if(run!==ocrRun||!msg.isConnected)return;
  const r=parseOrdonnance(text,state.meds.map(m=>m.name));
  if(r.date){const d=$('#s-date');if(d)d.value=r.date;}
  if(!r.lines.length){
    say('Aucun médicament reconnu. Reprenez la photo plus nette, à plat et bien éclairée, ou saisissez les lignes à la main.');
    return;
  }
  // remplace les lignes vides par celles lues
  $$('#lines .line').forEach(row=>{if(!$('.l-name',row).value.trim())row.remove();});
  $('#lines').insertAdjacentHTML('beforeend',r.lines.map(l=>lineHtml({name:matchKnown(l.name),perDay:l.perDay,days:l.days,raw:l.raw,read:true})).join(''));
  const n=r.lines.length,todo=r.lines.filter(l=>!(l.perDay>0)||!(l.days>0)).length;
  say(n+' '+pl(n,'médicament lu','médicaments lus')+'. Vérifiez chaque ligne avec l\u2019ordonnance'+(todo?' et complétez les cases en orange':'')+' avant d\u2019enregistrer.');
}

/* ---------- Photo d'ordonnance ---------- */
let pendingPhoto='';
/* Réduit la photo (1280 px, JPEG) pour qu'elle tienne dans le stockage du navigateur. */
function shrinkPhoto(file){
  return new Promise((ok,ko)=>{
    const url=URL.createObjectURL(file);
    const im=new Image();
    im.onload=()=>{
      const k=Math.min(1,1280/Math.max(im.naturalWidth,im.naturalHeight));
      const c=document.createElement('canvas');
      c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg',0.7));
    };
    im.onerror=()=>{URL.revokeObjectURL(url);ko();};
    im.src=url;
  });
}

/* ---------- Sauvegarde ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify({app:'pharmacie-foyer',version:2,exportedAt:new Date().toISOString(),data:state},null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='pharmacie-foyer-'+todayStr()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Sauvegarde téléchargée');
}
function importData(file){
  const rd=new FileReader();
  rd.onload=()=>{
    let raw;
    try{raw=JSON.parse(rd.result);}catch(e){toast('Ce fichier n\u2019est pas une sauvegarde valide.');return;}
    const d=raw&&raw.app==='pharmacie-foyer'?raw.data:raw;
    if(!d||!Array.isArray(d.meds)||!Array.isArray(d.scripts)){toast('Ce fichier n\u2019est pas une sauvegarde de la pharmacie.');return;}
    state=sanitize(d);openMeds.clear();tab='need';
    commit();toast('Sauvegarde restaurée : '+state.meds.length+' '+pl(state.meds.length,'médicament','médicaments')+', '+state.scripts.length+' '+pl(state.scripts.length,'ordonnance','ordonnances'));
  };
  rd.onerror=()=>toast('Ce fichier n\u2019a pas pu être lu.');
  rd.readAsText(file);
}

/* ---------- Enregistrements ---------- */
function saveBox(){
  const msg=$('#formMsg');
  const name=$('#f-name').value.trim();
  const perBox=Number($('#f-perbox').value);
  const boxes=Number($('#f-boxes').value)||1;
  const unitsIn=$('#f-units')?Number($('#f-units').value):NaN;
  const expiry=$('#f-exp').value;
  const lot=$('#f-lot').value.trim();
  const cip=sheet.dataset.cip||'';
  if(!name){msg.textContent='Indiquez le nom du médicament.';return;}
  if(!(perBox>0)){msg.textContent='Indiquez le nombre d\u2019unités par boîte.';return;}
  if(!(boxes>0)){msg.textContent='Indiquez le nombre de boîtes.';return;}
  let med=findMed(name,cip);
  if(!med){
    med={id:uid(),name:name,cip13:cip,perBox:perBox,countedAt:todayStr(),batches:[]};
    state.meds.push(med);
  }else{
    med.perBox=perBox;
    if(cip&&!med.cip13)med.cip13=cip;
  }
  const units=unitsIn>0?unitsIn:perBox*boxes;
  const same=lot&&expiry?med.batches.find(b=>b.lot===lot&&b.expiry===expiry):null;
  if(same)same.units=(Number(same.units)||0)+units;
  else med.batches.push({id:uid(),lot:lot,expiry:expiry,units:units});
  closeSheet();
  toast('Ajouté : '+fmt(units)+' '+pl(units,'unité','unités')+' de '+med.name);
  commit();
}

function saveMed(id){
  const m=state.meds.find(x=>x.id===id);if(!m)return;
  const msg=$('#formMsg');
  const name=$('#e-name').value.trim();
  if(!name){msg.textContent='Indiquez le nom du médicament.';return;}
  m.name=name;
  m.perBox=Math.max(0,Number($('#e-perbox').value)||0);
  closeSheet();toast('Médicament modifié');commit();
}

function saveScript(){
  const msg=$('#formMsg');
  const lines=$$('.line').map(r=>({
    name:$('.l-name',r).value.trim(),
    perDay:Number($('.l-perday',r).value),
    days:Number($('.l-days',r).value)
  })).filter(l=>l.name);
  if(!lines.length){msg.textContent='Ajoutez au moins un médicament.';return;}
  const bad=lines.find(l=>!(l.perDay>0)||!(l.days>0));
  if(bad){msg.textContent='Indiquez la quantité par jour et le nombre de jours pour « '+bad.name+' ».';return;}
  let memberId=$('#s-member').value;
  if(memberId==='__new'){
    const n=$('#s-newname').value.trim();
    if(!n){msg.textContent='Indiquez le prénom de la personne.';return;}
    const m={id:uid(),name:n};state.members.push(m);memberId=m.id;
  }
  const out=lines.map(l=>{
    let med=findMed(l.name,'');
    if(!med){med={id:uid(),name:l.name,cip13:'',perBox:0,countedAt:todayStr(),batches:[]};state.meds.push(med);}
    return {medId:med.id,perDay:l.perDay,days:l.days};
  });
  state.scripts.push({id:uid(),memberId:memberId,date:$('#s-date').value||todayStr(),active:true,photo:pendingPhoto,lines:out});
  pendingPhoto='';
  tab='need';
  closeSheet();
  toast('Ordonnance enregistrée');
  commit();
  window.scrollTo({top:0});
}

function loadDemo(){
  const lea={id:uid(),name:'Léa'},paul={id:uid(),name:'Paul'};
  const doli={id:uid(),name:'Doliprane 1000 mg',cip13:'',perBox:8,batches:[{id:uid(),lot:'',expiry:addDays(210),units:8}]};
  const amox={id:uid(),name:'Amoxicilline 500 mg',cip13:'',perBox:12,countedAt:addDays(-2),batches:[{id:uid(),lot:'',expiry:addDays(120),units:12}]};
  const ibu={id:uid(),name:'Ibuprofène 400 mg',cip13:'',perBox:12,batches:[{id:uid(),lot:'',expiry:addDays(-30),units:10}]};
  const vitd={id:uid(),name:'Vitamine D3 (ampoule)',cip13:'',perBox:4,batches:[{id:uid(),lot:'',expiry:addDays(40),units:4}]};
  state=sanitize({
    members:[lea,paul],
    meds:[doli,amox,ibu,vitd],
    scripts:[
      {id:uid(),memberId:lea.id,date:todayStr(),active:true,lines:[{medId:doli.id,perDay:3,days:4},{medId:ibu.id,perDay:3,days:5}]},
      {id:uid(),memberId:paul.id,date:addDays(-2),active:true,lines:[{medId:amox.id,perDay:3,days:7},{medId:vitd.id,perDay:1,days:3}]}
    ]
  });
  openMeds.clear();tab='need';commit();window.scrollTo({top:0});
}

/* ---------- Actions ---------- */
let tt=null;
function toast(t){
  const el=$('#toast');el.textContent=t;el.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),3200);
}

function act(a,el){
  const d=el.dataset;
  settle();
  switch(a){
    case 'open-script':openScript();break;
    case 'open-box':openBox(d.med);break;
    case 'edit-med':openMed(d.med);break;
    case 'close-sheet':closeSheet();break;
    case 'scan':startScan();break;
    case 'stop-scan':stopScan();break;
    case 'refocus':refocus();break;
    case 'torch':toggleTorch();break;
    case 'read-code':applyCode($('#f-code').value);break;
    case 'save-box':saveBox();break;
    case 'save-med':saveMed(d.med);break;
    case 'add-line':$('#lines').insertAdjacentHTML('beforeend',lineHtml());break;
    case 'del-line':{
      const rows=$$('.line');
      if(rows.length>1)el.closest('.line').remove();
      else $$('input',el.closest('.line')).forEach(i=>{i.value='';});
      break;
    }
    case 'save-script':saveScript();break;
    case 'toggle-script':{
      const s=state.scripts.find(x=>x.id===d.id);
      if(s){s.active=!s.active;commit();}
      break;
    }
    case 'del-script':state.scripts=state.scripts.filter(x=>x.id!==d.id);toast('Ordonnance supprimée');commit();break;
    case 'del-med':
      state.meds=state.meds.filter(m=>m.id!==d.med);
      state.scripts.forEach(s=>{s.lines=s.lines.filter(l=>l.medId!==d.med);});
      state.scripts=state.scripts.filter(s=>s.lines.length);
      openMeds.delete(d.med);toast('Médicament supprimé');commit();break;
    case 'del-batch':{
      const m=state.meds.find(x=>x.id===d.med);
      if(m){m.batches=m.batches.filter(b=>b.id!==d.batch);commit();}
      break;
    }
    case 'add-member':{
      const inp=$('#newMember');const n=inp.value.trim();
      if(!n){inp.focus();break;}
      state.members.push({id:uid(),name:n});commit();
      break;
    }
    case 'del-member':
      state.members=state.members.filter(m=>m.id!==d.id);
      state.scripts=state.scripts.filter(s=>s.memberId!==d.id);
      commit();break;
    case 'demo':loadDemo();break;
    case 'export':exportData();break;
    case 'install':
      if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render();});}
      break;
    case 'import':$('#import-file').click();break;
    case 'wipe':
      state={members:[],meds:[],scripts:[]};openMeds.clear();
      toast('Données effacées');commit();break;
  }
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-tab]');
  if(!el)return;
  if(el.dataset.tab){tab=el.dataset.tab;render();window.scrollTo({top:0});return;}
  if(el.dataset.confirm&&el.dataset.armed!=='1'){
    el.dataset.armed='1';el.dataset.label=el.textContent;
    el.textContent=el.dataset.confirm;el.classList.add('armed');
    setTimeout(()=>{
      if(el.isConnected&&el.dataset.armed==='1'){
        el.dataset.armed='0';el.textContent=el.dataset.label;el.classList.remove('armed');
      }
    },4000);
    return;
  }
  act(el.dataset.act,el);
});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='s-member'){syncNewMember();return;}
  if(t.matches&&t.matches('input[data-batch]')){
    const m=state.meds.find(x=>x.id===t.dataset.med);
    const b=m&&m.batches.find(x=>x.id===t.dataset.batch);
    if(b){settle();b.units=Math.max(0,Number(t.value)||0);commit();}
    return;
  }
  if(t.id==='f-name'){
    const m=findMed(t.value,'');
    const pb=$('#f-perbox');
    if(m&&m.perBox&&pb&&(!pb.value||pb.dataset.auto==='1')){pb.value=m.perBox;pb.dataset.auto='1';syncUnits();}
    return;
  }
  if(t.id==='f-perbox'){t.dataset.auto='0';syncUnits();return;}
  if(t.id==='f-boxes'){syncUnits();return;}
  if(t.id==='f-units'){t.dataset.manual=t.value?'1':'0';if(!t.value)syncUnits();return;}
  if(t.id==='s-photo'){
    const img=$('#s-preview');const f=t.files&&t.files[0];
    pendingPhoto='';
    if(!f){img.hidden=true;return;}
    shrinkPhoto(f).then(url=>{
      if(!img.isConnected)return;
      pendingPhoto=url;img.src=url;img.hidden=false;
    }).catch(()=>{toast('Cette image n\u2019a pas pu être lue.');});
    readPrescription(f);
  }
  if(t.id==='f-codephoto'){
    const f=t.files&&t.files[0];t.value='';
    if(f)decodePhoto(f);
  }
  if(t.id==='import-file'){
    const f=t.files&&t.files[0];t.value='';
    if(f)importData(f);
  }
});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-perbox'||t.id==='f-boxes'){t.classList.remove('check');syncUnits();return;}
  if(t.id==='f-exp'){syncExpWarn();return;}
  if(t.id==='f-name'||(t.classList&&t.classList.contains('l-name'))){t.classList.remove('check');suggestNames(t);}
  if(t.id==='zoom'&&scanTrack){scanTrack.applyConstraints({advanced:[{zoom:Number(t.value)}]}).catch(()=>{});return;}
  if(t.id==='f-name'&&sheet.dataset.cipSrc!=='scan'){
    const m=findMed(t.value,'');
    sheet.dataset.cip=m&&m.cip13?m.cip13:'';
  }
});
/* Un nombre pré-rempli est sélectionné en entier : taper le remplace au lieu de s'y ajouter. */
document.addEventListener('focusin',e=>{
  const t=e.target;
  if(t.id==='f-perbox'&&t.value)setTimeout(()=>{try{t.select();}catch(_){}} ,0);
});

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='newMember'){e.preventDefault();act('add-member',e.target);}
  else if(e.target.id==='f-code'){e.preventDefault();applyCode(e.target.value);}
});

document.addEventListener('toggle',e=>{
  const t=e.target;
  if(t.matches&&t.matches('details[data-med]')){
    if(t.open)openMeds.add(t.dataset.med);else openMeds.delete(t.dataset.med);
  }
},true);

/* ---------- Démarrage ---------- */
/* ---------- Installation et hors connexion ---------- */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(tab==='home')render();});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('Appli installée');if(tab==='home')render();});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
/* Demande au navigateur de ne pas effacer les données quand l'espace manque. */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}

settle();persist();
$('#today').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
render();
})();
